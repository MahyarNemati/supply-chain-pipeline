version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
