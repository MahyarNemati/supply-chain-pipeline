name: supply-chain

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository without tag. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
      context:
        description: Docker build context
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root
        type: string
        default: Dockerfile
      platforms:
        description: Comma separated target platforms
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: Newline separated build args
        type: string
        default: ""
      push:
        description: Push, sign and attest. Set false for pull requests to only build and scan.
        type: boolean
        default: true
      severity-cutoff:
        description: Fail when Grype finds a vulnerability at or above this severity (negligible, low, medium, high, critical)
        type: string
        default: high
      only-fixed:
        description: Only gate on vulnerabilities that have a fix available
        type: boolean
        default: true
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-24.04
    outputs:
      image:
        description: Image repository
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Manifest digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  COSIGN_VERSION: v3.0.6

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      started-on: ${{ steps.name.outputs.started-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: name
        env:
          INPUT_IMAGE: ${{ inputs.image-name }}
          REPO: ${{ github.repository }}
        run: |
          image="${INPUT_IMAGE:-ghcr.io/${REPO}}"
          image="${image,,}"
          if [[ "$image" == *@* || "${image##*/}" == *:* ]]; then
            echo "::error::image-name must not include a tag or digest: $image"
            exit 1
          fi
          {
            echo "image=$image"
            echo "started-on=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Buildx attestations are disabled: SBOMs and provenance are generated,
      # signed and attached in later jobs so every attestation shares one
      # signing identity and one verification path.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.push && inputs.platforms || 'linux/amd64' }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ inputs.push && steps.meta.outputs.tags || format('{0}:scan', steps.name.outputs.image) }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan local image
        id: local-scan
        if: ${{ !inputs.push }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.name.outputs.image }}:scan
          fail-build: true
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}
          output-format: sarif

      - name: Upload SARIF
        if: ${{ !inputs.push && always() && steps.local-scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.local-scan.outputs.sarif }}
          category: grype-container

  scan:
    name: SBOM and vulnerability gate
    if: inputs.push
    needs: build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Scanning the SBOM rather than re-pulling the image guarantees the
      # gate evaluates exactly the inventory that gets attested.
      - name: Grype severity gate
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}
          output-format: sarif

      - name: Upload SARIF
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container

  sign:
    name: Sign and attest
    if: inputs.push
    needs: [build, scan]
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      # The OIDC token's job_workflow_ref/sha identify this reusable workflow
      # as the caller pinned it, which is the identity Fulcio puts in the
      # signing certificate. Checking out the same commit keeps the composite
      # action in lockstep with the workflow that invoked it.
      - name: Resolve pipeline identity
        id: identity
        run: |
          token="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r .value)"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while (( ${#payload} % 4 )); do payload+="="; done
          claims="$(base64 -d <<<"$payload")"
          ref="$(jq -r .job_workflow_ref <<<"$claims")"
          sha="$(jq -r .job_workflow_sha <<<"$claims")"
          [[ -n "$ref" && "$ref" != null && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read workflow identity from OIDC token"; exit 1; }
          {
            echo "repository=${ref%%/.github/*}"
            echo "sha=$sha"
            echo "builder-id=${GITHUB_SERVER_URL}/${ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.identity.outputs.repository }}
          ref: ${{ steps.identity.outputs.sha }}
          path: .pipeline
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Sign and attest with cosign
        uses: ./.pipeline/.github/actions/sign-attest
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ env.DIGEST }}
          spdx-path: sbom.spdx.json
          cyclonedx-path: sbom.cdx.json
          builder-id: ${{ steps.identity.outputs.builder-id }}
          build-started-on: ${{ needs.build.outputs.started-on }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}

      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: GitHub SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        env:
          BUILDER_ID: ${{ steps.identity.outputs.builder-id }}
        run: |
          {
            echo "### Published image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}@${DIGEST}\` |"
            echo "| Signer identity | \`${BUILDER_ID}\` |"
            echo "| Attestations | SPDX, CycloneDX, SLSA v1 provenance (cosign), GitHub build provenance and SBOM |"
            echo
            echo '```sh'
            echo "example/verify.sh ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
